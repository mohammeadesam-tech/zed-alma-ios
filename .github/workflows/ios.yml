

name: Build Zed Alma iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare project
        run: |
          unzip zid_alma_ios_project.zip -d project
          cd project
          npm install
          npx cap add ios
          npx cap sync ios

      - name: Build iOS
        run: |
          cd project/ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package iOS app
        run: |
          cd project/ios/App/build/Build/Products/Release-iphoneos
          zip -r zed-alma-ios-app.zip App.app

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: zed-alma-ios
          path: project/ios/App/build/Build/Products/Release-iphoneos/zed-alma-ios-app.zip
          if-no-files-found: error
          retention-days: 7
