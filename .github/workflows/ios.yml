name: Build Zed Alma iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unzip project
        run: |
          unzip zid_alma_ios_project.zip -d project
          cd project
          npm install
          npx cap add ios
          npx cap sync ios

      - name: Build iOS
        run: |
          cd project/ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
