name: Build Zed Alma iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare project
        run: |
          unzip zid_alma_ios_project.zip -d project
          cd project
          npm install
          npx cap add ios
          npx cap sync ios

      - name: Build iOS
        run: |
          cd project/ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zed-alma-ios-build
          path: project/ios/App/build/
          if-no-files-found: warn
